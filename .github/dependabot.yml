version: 2
updates:
  # Keep the SHA-pinned GitHub Actions fresh automatically, so pinning for
  # supply-chain safety does not mean they silently go stale.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"

  # Keep devDependencies (ESLint, Playwright, axe-core) patched against CVEs.
  # Runtime stays zero-dependency; major bumps remain held for human review.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
