name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage static GitHub Pages bundle
        run: |
          mkdir -p _site/docs _site/blueprint _site/dist
          cp index.html style.css game.js service-worker.js manifest.webmanifest robots.txt sitemap.xml _site/
          cp -r src _site/src
          cp -r docs/assets _site/docs/assets
          cp -r blueprint/* _site/blueprint/
          cp dist/Donahue_2026_glidiebirdie_deterministic_browser_architecture.pdf _site/dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
