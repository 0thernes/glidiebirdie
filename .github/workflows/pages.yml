name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimum workflow-level scope; Pages deployment scopes are isolated to jobs.deploy.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage static GitHub Pages bundle
        run: |
          mkdir -p _site/docs _site/blueprint _site/dist
          cp index.html style.css game.js service-worker.js manifest.webmanifest robots.txt sitemap.xml _site/
          cp -r src _site/src
          cp -r docs/assets _site/docs/assets
          cp -r docs/media _site/docs/media
          cp -r blueprint/* _site/blueprint/
          cp dist/Donahue_2026_glidiebirdie_deterministic_browser_architecture.pdf _site/dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    permissions:
      contents: read
      # Required strictly by actions/deploy-pages.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
