name: Release

# Publishes a GitHub Release with SHA256SUMS and SLSA provenance when a version tag is pushed.
# This workflow does not create tags. See RELEASING.md.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SHA256SUMS for release artifacts
        run: |
          sha256sum \
            index.html style.css game.js service-worker.js manifest.webmanifest \
            dist/Donahue_2026_glidiebirdie_deterministic_browser_architecture.pdf \
            dist/arxiv_submission.tar.gz \
            results/benchmarks.json > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        continue-on-error: true
        with:
          subject-path: |
            dist/Donahue_2026_glidiebirdie_deterministic_browser_architecture.pdf
            dist/arxiv_submission.tar.gz
            SHA256SUMS

      - name: Create the release from the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Donahue_2026_glidiebirdie_deterministic_browser_architecture.pdf \
            dist/arxiv_submission.tar.gz \
            SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
